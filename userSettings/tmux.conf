# Make it use C-a, similar to screen..
unbind C-b
unbind l
set -g prefix C-a

bind -n M-,  previous-window
bind -n M-.  next-window

# reload config without killing server
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

# disable auto renaming
setw -g automatic-rename off

# I personally rebind the keys so “|” splits the current window vertically, and
# “-” splits it horizontally. Not the easiest things to type, though easy to
# remember.
unbind %
bind | split-window -h
bind - split-window -v

# Pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r Left  resize-pane -L 2
bind -r Down  resize-pane -D 2
bind -r Up    resize-pane -U 2
bind -r Right resize-pane -R 2

#kill session
bind K confirm kill-session

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# fixes the delay problem
set -sg escape-time 0

set-option -g history-limit 5000

## make mouse happy in tmux
## source: https://github.com/tmux/tmux/issues/145
set -g terminal-overrides "xterm*:colors=256:Tc"
set-option -g -q mouse on

setw -g mode-keys vi

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

#Set Tmux plugin to resurrect every time workstation restarted
#(Ctrl+A Ctrl+S to Save / Ctrl+A Ctrl+R to Resurrect)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#Put this plugin at last to keep status-right setting clean
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore tmux windows when tmux starts.
set -g @continuum-restore 'on'

# Don't auto-launch tmx at machine boot.  Give me a chance to gcert first.
set -g @continuum-boot 'off'

######################
### DESIGN CHANGES ###
######################

# panes
#set -g pane-border-fg black
#set -g pane-active-border-fg brightred
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightred

## Status bar design
# status line
set -g status-justify left
#set -g status-bg default
#set -g status-fg colour12
set -g status-style fg=colour12,bg=default
set -g status-interval 2

# messaging
#set -g message-fg black
#set -g message-bg yellow
#set -g message-command-fg blue
#set -g message-command-bg black
set -g message-style fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black

#window mode
#setw -g mode-bg colour6
#setw -g mode-fg colour0
setw -g mode-style fg=colour0,bg=colour6

# window status
setw -g window-status-format " #F#I:#W#F "
setw -g window-status-current-format " #F#I:#W#F "
setw -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #W "
setw -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #W "
#setw -g window-status-current-bg colour0
#setw -g window-status-current-fg colour11
#setw -g window-status-current-attr dim
set -g window-status-current-style fg=colour11,bg=colour0,dim

#setw -g window-status-bg green
#setw -g window-status-fg black
#setw -g window-status-attr reverse
set -g window-status-style fg=black,bg=green,reverse

# Info on left (I don't have a session display for now)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity on 
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on
set-option -g bell-action none

set -g default-terminal screen-256color

# The modes {
setw -g clock-mode-colour colour135
#set -g mode-attr bold
#set -g mode-fg colour196
#set -g mode-bg colour238
set -g mode-style fg=colour196,bg=colour238,bold
# }

# The panes {
#set -g pane-border-bg colour235
#set -g pane-border-fg colour238
#set -g pane-active-border-bg colour236
#set -g pane-active-border-fg colour51
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236
